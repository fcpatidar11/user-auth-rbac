syntax = "proto3";

package notificationPackage;

service notificationService {
  rpc sendEmailNotification(SendEmailNotificationRequest) returns (notificationResponse);
  rpc sendSMSNotification(SendSMSNotificationRequest) returns (notificationResponse);
  rpc sendPushNotification(SendPushNotificationRequest) returns (notificationResponse);
  rpc sendVerificationCode(SendVerificationCodeRequest) returns (notificationResponse);
  rpc verifyOTPCode(VerifyOTPCodeRequest) returns (notificationResponse);
}

message UserInfo {
  string firstName = 1;
  string lastName = 2;    
  string email = 3;
}
message ReplacePattern {
  string pattern = 1;
  string value = 2;
}

message SendEmailNotificationRequest {
  string email = 1;
  string templateName = 2;
  repeated ReplacePattern templateVariables = 3; 
}

message SendVerificationCodeRequest {
  string phoneNumber = 1;
}

message SendSMSNotificationRequest {
  string phoneNumber = 1;
  string templateName = 2;
  repeated ReplacePattern templateVariables = 3; 
}

message SendPushNotificationRequest {
  string deviceToken = 1;
  string title = 2;
  string body = 3;
  UserInfo user = 4;
}

message VerifyOTPCodeRequest {
  string phoneNumber = 1;
  string code = 2;
}
message SendEmailNotificationResponse {
  int32 code = 1;
  string message = 2;
  UserInfo user = 3;
}

message notificationResponse {
  UserInfo data = 1;
  string details = 2;
  int32 code = 3;
}

